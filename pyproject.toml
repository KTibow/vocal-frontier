[project]
name = "vocal-frontier"
version = "0.1.0"
description = "Open challenge: push the speed/quality frontier of vocal separation"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2", "soundfile>=0.12", "onnxruntime==1.23.*", "openvino==2026.*", "pyyaml>=6", "onnx>=1.17", "pytest>=8", "remotezip>=0.12"]

[project.scripts]
vf = "vf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vf"]
