<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-labelledby="t">
<title id="t">Speed across, quality up. Existing models form a staircase and the area under it is already covered. A new entry above the staircase is paid for the six squares of area only it covers.</title>
<style>@font-face{font-family:B;src:url(data:font/woff2;base64,) format("woff2");font-weight:400 700}
svg{--bg:#fcfcfb;--line:#e2dfd6;--ink:#1c1b18;--ink2:#55524a;--grid:#d5dbe3;--gridout:#eceadf;--cov:#e1e8f1;--old:#3f7cc4;--you:#c2307e;--new:#f5cfe3;--newtext:#8f1f5b}
@media (prefers-color-scheme:dark){svg{--bg:#1a1a19;--line:#33322d;--ink:#eeece6;--ink2:#b9b6ac;--grid:#3a4552;--gridout:#2a2a26;--cov:#27303b;--old:#5a96dc;--you:#dd5ca0;--new:#5e2746;--newtext:#ffd0e8}}
text{font-family:B,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink2);font-size:16px}
.b{font-weight:700;fill:var(--ink)}
.you{font-weight:700;fill:var(--you)}
.n{font-size:15px;font-weight:600;fill:var(--newtext);text-anchor:middle}
.c{animation:11s linear infinite}
#sweep{opacity:0;transform-origin:84px 356px;animation-name:sweep}
#entry{transform-origin:516px 148px;animation-name:entry}
#say{animation-name:say}
@media (prefers-reduced-motion:reduce){.c{animation:none!important}}
@keyframes entry{0%,5.45%{opacity:0;transform:scale(.2)}8.64%,94.55%{opacity:1;transform:none}100%{opacity:0}}
@keyframes sweep{0%,10.91%{opacity:.35;transform:scale(0)}20.00%{opacity:.35;transform:none}25.45%,100%{opacity:0;transform:none}}
@keyframes c0{0%,27.27%{opacity:0}29.55%,94.55%{opacity:1;transform:none}100%{opacity:0}}
#c0{animation-name:c0}
@keyframes c1{0%,31.09%{opacity:0}33.36%,94.55%{opacity:1;transform:none}100%{opacity:0}}
#c1{animation-name:c1}
@keyframes c2{0%,34.91%{opacity:0}37.18%,94.55%{opacity:1;transform:none}100%{opacity:0}}
#c2{animation-name:c2}
@keyframes c3{0%,38.73%{opacity:0}41.00%,94.55%{opacity:1;transform:none}100%{opacity:0}}
#c3{animation-name:c3}
@keyframes c4{0%,42.55%{opacity:0}44.82%,94.55%{opacity:1;transform:none}100%{opacity:0}}
#c4{animation-name:c4}
@keyframes c5{0%,46.36%{opacity:0}48.64%,94.55%{opacity:1;transform:none}100%{opacity:0}}
#c5{animation-name:c5}
@keyframes say{0%,51.09%{opacity:0}54.73%,94.55%{opacity:1;transform:none}100%{opacity:0}}
</style>
<rect x=".5" y=".5" width="719" height="435" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<clipPath id="under"><path d="M84,356V96H228V200H444V304H588V356Z"/></clipPath>
<path d="M156,44V356M228,44V356M300,44V356M372,44V356M444,44V356M516,44V356M588,44V356M84,304H660M84,252H660M84,200H660M84,148H660M84,96H660" stroke="var(--gridout)" fill="none"/>
<path d="M84,356V96H228V200H444V304H588V356Z" fill="var(--cov)"/>
<path d="M156,44V356M228,44V356M300,44V356M372,44V356M444,44V356M516,44V356M588,44V356M84,304H660M84,252H660M84,200H660M84,148H660M84,96H660" stroke="var(--grid)" fill="none" clip-path="url(#under)"/>
<rect id="sweep" class="c" x="84" y="148" width="432" height="208" fill="var(--you)"/>
<g id="c0" class="c"><rect x="228" y="148" width="72" height="52" fill="var(--new)" stroke="var(--bg)" stroke-width="1.5"/><text class="n" x="264.0" y="179.5">1</text></g><g id="c1" class="c"><rect x="300" y="148" width="72" height="52" fill="var(--new)" stroke="var(--bg)" stroke-width="1.5"/><text class="n" x="336.0" y="179.5">2</text></g><g id="c2" class="c"><rect x="372" y="148" width="72" height="52" fill="var(--new)" stroke="var(--bg)" stroke-width="1.5"/><text class="n" x="408.0" y="179.5">3</text></g><g id="c3" class="c"><rect x="444" y="148" width="72" height="52" fill="var(--new)" stroke="var(--bg)" stroke-width="1.5"/><text class="n" x="480.0" y="179.5">4</text></g><g id="c4" class="c"><rect x="444" y="200" width="72" height="52" fill="var(--new)" stroke="var(--bg)" stroke-width="1.5"/><text class="n" x="480.0" y="231.5">5</text></g><g id="c5" class="c"><rect x="444" y="252" width="72" height="52" fill="var(--new)" stroke="var(--bg)" stroke-width="1.5"/><text class="n" x="480.0" y="283.5">6</text></g>
<g id="say" class="c"><path d="M228,200V148H516V304H444V200Z" fill="none" stroke="var(--you)" stroke-width="2" stroke-linejoin="round"/>
<text class="you" x="534" y="170">6 new units</text>
<text x="534" y="191">what you’re paid for</text></g>
<path d="M84,356V96H228V200H444V304H588V356" fill="none" stroke="var(--old)" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M84,28V356H686" fill="none" stroke="var(--ink2)" stroke-width="1.5"/>
<path d="M79,34L84,24L89,34Z M682,351L692,356L682,361Z" fill="var(--ink2)"/>
<circle cx="228" cy="96" r="7.5" fill="var(--old)" stroke="var(--bg)" stroke-width="2"/><circle cx="444" cy="200" r="7.5" fill="var(--old)" stroke="var(--bg)" stroke-width="2"/><circle cx="588" cy="304" r="7.5" fill="var(--old)" stroke="var(--bg)" stroke-width="2"/>
<g id="entry" class="c"><path d="M516,137L527,148L516,159L505,148Z" fill="var(--you)" stroke="var(--bg)" stroke-width="2"/><text class="you" x="534" y="149">your entry</text></g>
<text x="242" y="88" style="fill:var(--old);font-weight:600">existing models</text>
<text class="b" x="264.0" y="278.0" text-anchor="middle">already covered</text>
<text x="264.0" y="299.0" text-anchor="middle">earns nothing</text>
<text class="b" x="660" y="62" text-anchor="end">1 square = 1 unit</text>
<text x="660" y="83" text-anchor="end">one doubling of speed × one dB</text>
<text x="74" y="361" text-anchor="end">floor</text>
<text x="84" y="380" text-anchor="middle">1/16×</text>
<text x="372.0" y="414" text-anchor="middle">speed, each column twice as fast</text>
<text transform="translate(30 200.0) rotate(-90)" text-anchor="middle">quality, 1 dB per row</text>
</svg>
